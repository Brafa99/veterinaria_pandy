name: veterinaria_pandy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter  
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  shared_preferences: ^2.2.3
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  csv: ^5.0.0
  image_picker: ^1.0.7
  share_plus: ^7.0.0
  path_provider: ^2.0.0
  fl_chart: ^0.68.0
  open_file: ^3.5.10
  firebase_storage: ^13.1.0
  flutter_image_compress: ^2.3.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/pandy.jpeg"
  web:
    generate: true
    image_path: "assets/img/pandy.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
